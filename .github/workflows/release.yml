name: Publish Open Music 1.7.0
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Android]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: open-music-release-1.7.0
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and validate
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Prepare release assets
        run: |
          python3 tools/source_fingerprint.py --verify
          python3 tools/assemble_update.py --video
          mkdir release-assets
          cd distribution
          sha256sum --check SHA256SUMS
          cd ..
          cp distribution/Open-Music-1.7.0.apk release-assets/Open-Music-1.7.0.apk
          git archive --format=zip --output=release-assets/Open-Music-source.zip HEAD
          cd release-assets
          sha256sum Open-Music-1.7.0.apk Open-Music-source.zip > SHA256SUMS
      - name: Publish APK and source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.7.0 >/dev/null 2>&1; then
            echo 'Release v1.7.0 already exists; preserving it.'
            exit 0
          fi
          gh release create v1.7.0 release-assets/Open-Music-1.7.0.apk release-assets/Open-Music-source.zip release-assets/SHA256SUMS --target "$(git rev-parse HEAD)" --title "Open Music 1.7.0" --notes-file docs/RELEASE-1.7.0.md
