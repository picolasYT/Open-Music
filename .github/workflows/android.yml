name: Android
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for Android checks
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify profiles, migration, artwork and tutorial on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=com.picolas.openmusic.ProfileDeviceTest,com.picolas.openmusic.CustomizationDeviceTest
            adb pull /sdcard/Android/data/com.picolas.openmusic.next/files qa-screens
            if [ -d distribution/apk-1.6.0 ]; then
              python3 tools/assemble_release.py
              adb uninstall com.picolas.openmusic.next
              cp distribution/Open-Music-1.5.1.apk previous.apk
              adb install previous.apk
              adb shell run-as com.picolas.openmusic.next mkdir -p files
              adb shell run-as com.picolas.openmusic.next sh -c '"echo upgrade-keeps-data > files/upgrade-check.txt"'
              adb install -r distribution/Open-Music-1.6.0.apk
              adb shell run-as com.picolas.openmusic.next cat files/upgrade-check.txt | grep -Fx upgrade-keeps-data
              adb shell am start -n com.picolas.openmusic.next/com.picolas.openmusic.MainActivity
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Open-Music-1.6.1-CI
          path: |
            qa-screens/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
