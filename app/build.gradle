plugins { id 'com.android.application' }
def signingFile = System.getenv('OPEN_MUSIC_KEYSTORE_FILE')
def usePrivateSigning = signingFile != null && !signingFile.isEmpty()
android {
    namespace 'com.picolas.openmusic'
    compileSdk 35
    defaultConfig { applicationId 'com.picolas.openmusic.next'; minSdk 26; targetSdk 35; versionCode 6; versionName '1.5.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { if (usePrivateSigning) { development { storeFile file(signingFile); storePassword System.getenv('OPEN_MUSIC_KEYSTORE_PASSWORD'); keyAlias System.getenv('OPEN_MUSIC_KEY_ALIAS'); keyPassword System.getenv('OPEN_MUSIC_KEY_PASSWORD') } } }
    buildTypes { debug { if (usePrivateSigning) signingConfig signingConfigs.development }; release { minifyEnabled false; if (usePrivateSigning) signingConfig signingConfigs.development } }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.4'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    androidTestImplementation 'org.mozilla:rhino:1.8.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
